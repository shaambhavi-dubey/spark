services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -c '</dev/tcp/localhost/9092' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Step 1: Retrain generates embeddings + shared graph ──────────────
  retrain:
    build:
      context: .
      dockerfile: docker/Dockerfile.retrain
    container_name: upi-retrain
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SHARED_GRAPH_PATH=/shared/shared_graph.pkl
      - RETRAIN_INTERVAL_SECONDS=120
      - NEW_ACCOUNTS_PER_CYCLE=3000
    volumes:
      - shared-graph-data:/shared
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Step 2: Producer reads shared graph, pushes txns to Kafka ────────
  producer:
    build:
      context: .
      dockerfile: docker/Dockerfile.producer
    container_name: upi-producer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SHARED_GRAPH_PATH=/shared/shared_graph.pkl
    volumes:
      - shared-graph-data:/shared
    depends_on:
      kafka:
        condition: service_healthy
      retrain:
        condition: service_started
    restart: unless-stopped

  # ── Step 3: Consumer reads txns from Kafka, scores via Redis ─────────
  consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.consumer
    container_name: upi-consumer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MODEL_PATH=xgb_fraud_model.json
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Step 4: Dashboard reads from Redis, shows live results ───────────
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: upi-dashboard
    ports:
      - "8501:8501"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  shared-graph-data:
